{# 挂载格(策略列表「挂载」列的内容; AJAX 原地刷新与整页渲染共用同一份 —
   变量: mc_sid 策略id / mc_status 策略状态 / mc_mv {rows,addable} / volume_presets) #}
{% if mc_mv and (mc_mv.rows or mc_mv.addable) %}
{% for mt in mc_mv.rows %}
<span style="white-space:nowrap">
  <form method="post" action="{{ url_for('strategies.set_mount', strategy_id=mc_sid) }}" class="inline"
        {% if mc_status == 'LIVE' %}onsubmit="return confirm('#{{ mc_sid }} LIVE 真金 @ {{ mt.host }} 改挂载点手数, 下一单生效 — 确认?')"{% endif %}>
    <input type="hidden" name="host_id" value="{{ mt.host_id }}">
    <span class="mono muted">{{ mt.host }}</span>
    <select name="volume" class="small" data-autosubmit
            title="该挂载点手数(空=策略手数→全局默认); 选完即提交, runner 下一轮生效">
      <option value="">默认</option>
      {% if mt.volume is not none and mt.volume not in volume_presets %}
      <option value="{{ '%g' % mt.volume }}" selected>{{ '%g' % mt.volume }}(旧值)</option>
      {% endif %}
      {% for v in volume_presets %}
      <option value="{{ '%g' % v }}" {% if mt.volume == v %}selected{% endif %}>{{ '%g' % v }}</option>
      {% endfor %}
    </select>
  </form><form method="post" action="{{ url_for('strategies.unmount', strategy_id=mc_sid) }}" class="inline"
        onsubmit="return confirm('卸载 #{{ mc_sid }} @ {{ mt.host }}{{ ' — LIVE 真金!' if mc_status == 'LIVE' else '' }} 该机停跑此策略, 确认?')">
    <input type="hidden" name="host_id" value="{{ mt.host_id }}">
    <button class="small" title="卸载(软停用, 保留手数记忆; 状态联动不会自动复活)">×</button>
  </form>
</span>
{% endfor %}
{% if mc_mv.addable %}
<form method="post" action="{{ url_for('strategies.set_mount', strategy_id=mc_sid) }}" class="inline"
      {% if mc_status == 'LIVE' %}onsubmit="return confirm('把 #{{ mc_sid }} 加挂到另一台 LIVE 真金机器 — 两个账户同时下单, 确认?')"{% endif %}>
  <select name="host_id" class="small" data-autosubmit
          title="加挂到该角色另一台 worker(一策略多机=多账户同时跑, 成交按账户分开)">
    <option value="">+挂</option>
    {% for h in mc_mv.addable %}<option value="{{ h.id }}">{{ h.name }}</option>{% endfor %}
  </select>
</form>
{% endif %}
{% else %}<span class="muted" title="CANDIDATE/ARCHIVED 不挂载; 转 DEMO/LIVE 自动挂">—</span>{% endif %}
