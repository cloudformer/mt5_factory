# MT5 Factory - Docker Compose
# 运行在 Linux VM（或 Mac 本地开发）: app + pgsql
# Windows VM 上的 MT5 worker 见 windows_mt5/，通过 mt5_hosts 表注册进系统

services:
  # ========== PostgreSQL（所有数据的唯一真实来源） ==========
  postgres:
    image: postgres:16-alpine
    container_name: mt5_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - ./containers/postgres/data:/var/lib/postgresql/data   # 数据在 repo 内 (gitignore)
      # 不挂 initdb 脚本: schema 由 api 启动时自动执行 containers/postgres/schema/ (唯一机制)
    # 内存口径(2026-08-04 实测定版): shared_buffers 大池(10G)热对热实测反而更慢(1:57 vs 1:36)
    # — 大顺序扫描走 ~256KB 环形缓冲根本不进大池, 大池只是挤掉 OS 页缓存(双重缓存浪费);
    # 本负载(多 worker 扫 M1)OS 页缓存是主力, pg 池保持默认小。
    # effective_cache_size 零内存占用(纯规划器情报); work_mem 服务排名/汇总 SQL
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=16GB
      - -c
      - work_mem=512MB
      # SSD 情报修正(2026-08-05): 默认值按机械盘假设, 虚机下面是 NVMe/SSD —
      # 预读更激进 + 随机读不再按贵算(规划器更敢走索引); 零内存零风险
      - -c
      - effective_io_concurrency=200
      - -c
      - random_page_cost=1.1
      # 大扫描并行(2026-08-05): 单条大范围查询允许 pg 自己开并行工人分段扫,
      # 单 worker 等一条 M1 大查询的墙钟直接除以并行度(核够就吃)
      - -c
      - max_parallel_workers_per_gather=4
      - -c
      - max_parallel_workers=6
    networks:
      - mt5_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ========== 预热(一次性任务, 2026-08-05 与 Frank 定): K线分区焐进 OS 页缓存 ==========
  # 13G 全热后回测扫 M1 零磁盘 IO。profiles 隔离: 平时 up 不启动, 需要时 make prewarm
  # (= docker compose run --rm prewarm)。VM 重启后跑一次; 幂等, 不跑只影响冷段首扫速度
  prewarm:
    image: postgres:16-alpine
    profiles: ["ops"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    entrypoint: ["psql", "-c",
      "CREATE EXTENSION IF NOT EXISTS pg_prewarm;",
      "-c",
      "SELECT inhrelid::regclass AS partition,
              pg_prewarm(inhrelid::regclass, 'read') AS heap_blocks,
              pg_prewarm((SELECT indexrelid FROM pg_index
                           WHERE indrelid = inhrelid LIMIT 1)::regclass, 'read') AS pk_blocks
       FROM pg_inherits WHERE inhparent = 'historical_bars'::regclass;"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mt5_network

  # ========== API（业务服务，按需再拆） ==========
  api:
    build:
      context: .
      dockerfile: containers/api/Dockerfile
    container_name: mt5_api
    restart: unless-stopped
    environment:
      ENV_NAME: ${ENV_NAME}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # BRIDGE_API_KEY 已退役(2026-07-26 v7.2 收口): api 对 worker 零出站, 没有"api调我"要保护
      MT5_HOSTS: ${MT5_HOSTS:-}
      MT5_PORT: ${MT5_PORT:-8020}
    ports:
      - "${API_PORT}:8010"
    volumes:
      - ./containers/api/src:/app/src:ro       # 开发热更新 (uvicorn --reload)
      - ./strategy_core:/app/strategy_core:ro
      - ./containers/postgres/schema:/app/schema:ro   # schema 唯一来源, api 启动自动执行
      - ./scripts:/app/scripts:ro   # 运维/验收脚本(只读): docker compose exec api python /app/scripts/xxx.py
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mt5_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ========== 回测 worker(与 api 同镜像, 只跑 jobs 消费循环) ==========
  # 无端口无状态: SKIP LOCKED 抢单 + 租约回收 + UPSERT 幂等, 加减副本/杀进程都不脏数据。
  # 副本数唯一源 = Makefile WORKERS(默认0=原行为只有api内1路; 改Makefile提交即CI生效): make up/scale WORKERS=N
  # 上限参考: N ≤ VM核数-1(CPU密集), 每路缓存当前品种 M1 会占内存, RAM 紧就调小
  worker:
    build:
      context: .
      dockerfile: containers/api/Dockerfile
    # 不设 container_name: 多副本自动编号 worker-1..N(WORKER=容器名:pid, 租约互不撞)
    restart: unless-stopped
    command: ["python", "-m", "src.worker"]
    environment:
      ENV_NAME: ${ENV_NAME}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./containers/api/src:/app/src:ro       # 与 api 同源热更新
      - ./strategy_core:/app/strategy_core:ro
    depends_on:
      api:
        condition: service_healthy   # api healthy = schema 已对齐, worker 不碰建表
    networks:
      - mt5_network

  # ========== Web 前端 (Flask, 只调 api) ==========
  web:
    build:
      context: ./containers/web
      dockerfile: Dockerfile
    container_name: mt5_web
    restart: unless-stopped
    environment:
      API_URL: http://api:8010   # 内部接线: 服务名+内部端口, 与本文件的 api 服务定义同源
      SECRET_KEY: ${SECRET_KEY:-mt5web}
    ports:
      - "${WEB_PORT}:8000"
    volumes:
      - ./containers/web:/app:ro   # 开发热更新 (gunicorn --reload)
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mt5_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  mt5_network:
    driver: bridge
